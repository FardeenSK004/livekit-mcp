[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) Server for LiveKit Voice Agent and Telephony Services"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MantraCare Team" }
]
dependencies = [
    "asyncpg>=0.31.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.2.0,<1.3.0",
    "phonenumbers>=9.0.37",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyjwt[crypto]>=2.10.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.40.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
livekit-mcp = "livekit_mcp.main:run"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/livekit_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]
